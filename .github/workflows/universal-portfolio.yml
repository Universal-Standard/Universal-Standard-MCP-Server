name: Universal Portfolio and Agent Loop

on:
  issues:
    types: [opened, reopened, edited, closed]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, closed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: Reconciliation mode
        required: true
        default: open-items
        type: choice
        options:
          - open-items
          - all-items
          - labels-only
          - full-reconcile
      dry_run:
        description: Preview reconciliation without mutations
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  universal-portfolio:
    uses: Universal-Standard/.github/.github/workflows/universal-portfolio-agent.yml@3de2c21ceeceeb440b499ceb07dcc749c202aee1
    with:
      system: mcp-server
      policy_ref: 3de2c21ceeceeb440b499ceb07dcc749c202aee1
      project_id: ${{ vars.PORTFOLIO_PROJECT_ID || '' }}
      enable_auto_merge: true
      max_remediation_passes: 10
      reconcile_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'current-item' }}
      dry_run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
    secrets:
      COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
